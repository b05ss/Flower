name: Render Flower Workshop PNG Posters

on:
  push:
    paths:
      - "scripts/render_posters.py"
      - ".github/workflows/render-flower-posters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          pip install pillow

      - name: Render posters
        run: python scripts/render_posters.py

      - name: Commit PNG outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters_png flower-workshop-posters-png.zip
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Render Flower Workshop PNG posters"
            git push
          fi

      - name: Upload PNG bundle
        uses: actions/upload-artifact@v4
        with:
          name: flower-workshop-posters-png
          path: |
            posters_png/*.png
            flower-workshop-posters-png.zip
